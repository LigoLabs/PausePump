<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1219" />
  <meta name="description" content="PausePump — gérez vos temps de repos entre les séries de muscu. Ultra simple." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PausePump" />
  <title>PausePump</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ÉCRAN 1 — Accueil : nombre de séries -->
  <section id="screen-home" class="screen is-active">
    <div class="home-inner">
      <h1 class="brand">Pause<span>Pump</span></h1>
      <p class="tagline">Gère tes temps de repos 💪</p>

      <h2 class="question">Combien de séries ?</h2>
      <div id="series-grid" class="series-grid" role="radiogroup" aria-label="Nombre de séries"></div>

      <button id="start-btn" class="btn-primary" type="button">C'est parti 💪</button>
    </div>
  </section>

  <!-- ÉCRAN 2 — Pauses -->
  <section id="screen-main" class="screen">
    <header class="topbar">
      <button id="home-btn" class="icon-btn" type="button" aria-label="Retour à l'accueil">⌂</button>
      <div class="series-counter">
        <button id="series-minus" class="step-btn" type="button" aria-label="Une série de moins">−</button>
        <div class="series-readout">
          <span id="series-remaining" class="series-num">0</span>
          <span class="series-label">séries restantes</span>
        </div>
        <button id="series-plus" class="step-btn" type="button" aria-label="Une série de plus">+</button>
      </div>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <!-- Choix de la durée -->
    <div id="duration-view" class="view is-active">
      <h2 class="view-title">Choisis ta pause</h2>
      <div id="duration-grid" class="duration-grid" role="group" aria-label="Durée de la pause"></div>
    </div>

    <!-- Décompte -->
    <div id="timer-view" class="view">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="100" />
          <circle id="ring-progress" class="ring-progress" cx="110" cy="110" r="100" />
        </svg>
        <div class="ring-center">
          <span id="time-display" class="time-display">0:00</span>
          <span id="timer-state" class="timer-state">En cours</span>
        </div>
      </div>

      <div class="controls">
        <button id="reset-btn" class="ctrl-btn" type="button" aria-label="Reset">
          <span class="ctrl-ico">↺</span><span class="ctrl-txt">Reset</span>
        </button>
        <button id="playpause-btn" class="ctrl-btn ctrl-main" type="button" aria-label="Pause / Reprendre">
          <span class="ctrl-ico" id="playpause-ico">⏸</span><span class="ctrl-txt" id="playpause-txt">Pause</span>
        </button>
        <button id="change-btn" class="ctrl-btn" type="button" aria-label="Changer la durée">
          <span class="ctrl-ico">⟲</span><span class="ctrl-txt">Durée</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ÉCRAN 3 — Fin -->
  <section id="screen-done" class="screen">
    <div class="done-inner">
      <div class="done-emoji">🎉</div>
      <h1 class="done-title">Terminé !</h1>
      <p class="done-sub">Belle séance, repose-toi bien.</p>
      <button id="newsession-btn" class="btn-primary" type="button">Nouvelle séance</button>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>

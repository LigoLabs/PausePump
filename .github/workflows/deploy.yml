name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/pausepump-rest-timer-xvxn1n
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-busting version
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "Build version: $VERSION"
          sed -i "s/__BUILD_VERSION__/$VERSION/g" index.html sw.js
          echo "— index.html —"; grep -o '?v=[0-9a-f]*' index.html | sort -u
          echo "— sw.js —"; grep -o "pausepump-[0-9a-f]*" sw.js | head -1

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Certains plugins compilent Java 11 / Kotlin 1.8 → on désactive la vérification
# stricte de cohérence JVM-target (sinon le build échoue sur ces plugins).
kotlin.jvm.target.validation.mode=ignore
# Le cache pub (C:\) et le projet (D:\) sont sur des disques différents : le
# compilateur incrémental Kotlin plante (RelocatableFileToPathConverter :
# « different roots »). On désactive l'incrémental Kotlin pour ce cas.
kotlin.incremental=false
